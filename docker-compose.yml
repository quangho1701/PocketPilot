services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.3.0
    container_name: pocketpilot-crdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - crdb-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pocketpilot-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      cockroachdb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  crdb-data:
